<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPH MBQ 'Ilman Wa Ruuhan Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-area { width: 100% !important; margin: 0 !important; padding: 0 !important; }
      body { background-color: white !important; font-size: 11pt; }
      .page-break { page-break-before: always; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Header App -->

      <div>
        <h1 class="text-xl font-bold">RPH MBQ 'Ilman Wa Ruuhan Generator</h1>
        <p class="text-xs text-emerald-100">Badan Pengembangan Pendidikan Al-Qur’an – JSIT Indonesia</p>
      </div>
      <div class="flex gap-2">
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded text-sm font-semibold transition">
          🖨️ Cetak / PDF
        </button>
        <button onclick="downloadWord()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 px-3 py-1.5 rounded text-sm font-semibold transition">
          📄 Unduh Word (.doc)
        </button>
      </div>
    </div>
  </header>

  <!-- Container Utama -->
  <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6 my-4">

      <h2 class="text-lg font-bold text-emerald-800 border-b pb-2">Pengaturan RPH</h2>
      
      <!-- Pilih Jenjang -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Jenjang Sekolah</label>

          <option value="SMP">SMP IT (Tahsin, Tahfizh, Tadabbur - 2 x 30 Menit)</option>
          <option value="SMA">SMA IT (Tahsin, Tahfizh, Tadabbur - 2 x 30 Menit)</option>
        </select>
      </div>

      <!-- Identitas Modul -->
      <div class="space-y-2 border-t pt-3">
        <h3 class="text-xs font-bold text-slate-500 uppercase">1. Identitas RPH</h3>
        <div>
          <label class="block text-xs font-medium text-slate-600">Judul Modul Ajar</label>
          <input type="text" id="judulModul" oninput="updatePreview()" class="w-full p-1.5 border rounded text-sm">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-600">Kelas / Fase</label>
            <input type="text" id="kelasFase" oninput="updatePreview()" class="w-full p-1.5 border rounded text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600">Tahun Pelajaran</label>
            <input type="text" id="tp" value="2025–2026" oninput="updatePreview()" class="w-full p-1.5 border rounded text-sm">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-600">Alokasi Waktu</label>
            <input type="text" id="alokasiWaktu" oninput="updatePreview()" class="w-full p-1.5 border rounded text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600">Jumlah Peserta</label>
            <input type="text" id="jumlahPeserta" oninput="updatePreview()" class="w-full p-1.5 border rounded text-sm">
          </div>
        </div>
      </div>

      <!-- Target Pertemuan -->
      <div class="space-y-2 border-t pt-3">
        <h3 class="text-xs font-bold text-slate-500 uppercase">2. Target Pertemuan Ini</h3>
        <div>
          <label class="block text-xs font-medium text-slate-600">Target Adab & Santun</label>
          <input type="text" id="targetAdab" oninput="updatePreview()" class="w-full p-1.5 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600">Target Hafalan</label>
          <input type="text" id="targetHafalan" oninput="updatePreview()" class="w-full p-1.5 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600" id="labelMakna">Target Kandungan Surat / Tadabbur</label>
          <input type="text" id="targetMakna" oninput="updatePreview()" class="w-full p-1.5 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600" id="labelMateriUtama">Target Materi Jilid / Tilawah</label>
          <input type="text" id="targetMateriUtama" oninput="updatePreview()" class="w-full p-1.5 border rounded text-sm">
        </div>
      </div>

      <!-- Tombol Aksi Form -->
      <div class="pt-2 flex gap-2">
        <button onclick="applyPreset()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-1.5 rounded text-xs font-semibold">
          Reset ke Defaut Jenjang
        </button>
      </div>
    </section>

    <!-- Document Preview (Kolom Kanan) -->
    <section class="lg:col-span-7 bg-white p-8 rounded-lg shadow border border-slate-200 print-area min-h-[85vh]">
      <div id="documentContent" class="text-slate-900 leading-relaxed text-sm">
        <!-- Konten RPH akan di-generate otomatis via JavaScript -->
      </div>
    </section>

  </main>

    let currentData = {};

    function applyPreset() {
      const jenjang = document.getElementById("jenjangSelect").value;
      currentData = JSON.parse(JSON.stringify(presets[jenjang]));

      document.getElementById("judulModul").value = currentData.judulModul;
      document.getElementById("kelasFase").value = currentData.kelasFase;
      document.getElementById("alokasiWaktu").value = currentData.alokasiWaktu;
      document.getElementById("jumlahPeserta").value = currentData.jumlahPeserta;
      document.getElementById("targetAdab").value = currentData.targetAdab;
      document.getElementById("targetHafalan").value = currentData.targetHafalan;
      document.getElementById("targetMakna").value = currentData.targetMakna;
      document.getElementById("targetMateriUtama").value = currentData.targetUtama;

      document.getElementById("labelMakna").innerText = currentData.labelMakna;
      document.getElementById("labelMateriUtama").innerText = currentData.labelUtama;

      updatePreview();
    }

          </tr>
          <tr>
            <td style="border: 1px solid #cbd5e1; font-weight: bold;">Hafalan</td>
            <td style="border: 1px solid #cbd5e1;">${currentData.capaianHafalan}</td>
            <td style="border: 1px solid #cbd5e1;">${currentData.targetHafalan}</td>
          </tr>
          <tr>
            <td style="border: 1px solid #cbd5e1; font-weight: bold;">${currentData.labelMakna.replace('Target ', '')}</td>
            <td style="border: 1px solid #cbd5e1;">${currentData.capaianMakna}</td>
            <td style="border: 1px solid #cbd5e1;">${currentData.targetMakna}</td>

          <tr>
            <td style="border: 1px solid #cbd5e1; font-weight: bold;">${currentData.aspekUtama}</td>

            <td style="border: 1px solid #cbd5e1;">${currentData.targetUtama}</td>

        <h3 style="font-weight: bold; font-size: 11pt; margin-top: 14px; margin-bottom: 4px; color: #166534;">Bagian III. Profil Pelajar IWR</h3>
        <div style="background-color: #f0fdf4; border: 1px solid #bbf7d0; padding: 8px; text-align: center; border-radius: 4px; font-weight: bold; margin-bottom: 12px; font-size: 9.5pt;">
          Taat kepada Allah – Memuliakan Al-Qur’an – Beradab terhadap Sesama<br>
          Bacaan sesuai Tajwid – Hafalan sesuai Target – Memahami Makna Surat dan Ayat
        </div>

        <!-- Bagian IV -->
        <h3 style="font-weight: bold; font-size: 11pt; margin-top: 14px; margin-bottom: 4px; color: #166534;">Bagian IV. Langkah-Langkah Pembelajaran (7 Langkah)</h3>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 10pt;" border="1" cellpadding="5">
          <tr style="background-color: #f8fafc;">
            <th style="width: 30%; text-align: left; border: 1px solid #cbd5e1;">Langkah & Durasi</th>
            <th style="text-align: left; border: 1px solid #cbd5e1;">Aktivitas Pembelajaran</th>
          </tr>
          ${currentData.langkah.map(step => `
            <tr>
              <td style="border: 1px solid #cbd5e1; font-weight: bold;">

              </td>
              <td style="border: 1px solid #cbd5e1;">${step.isi}</td>
            </tr>
          `).join('')}
        </table>

        <!-- Bagian V -->
        <h3 style="font-weight: bold; font-size: 11pt; margin-top: 14px; margin-bottom: 4px; color: #166534;">Bagian V. Penilaian</h3>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 10pt;" border="1" cellpadding="5">
          <tr style="background-color: #f8fafc;">
            <th style="width: 25%; text-align: left; border: 1px solid #cbd5e1;">Aspek</th>
            <th style="width: 30%; text-align: left; border: 1px solid #cbd5e1;">Teknik Penilaian</th>
            <th style="text-align: left; border: 1px solid #cbd5e1;">Instrumen</th>
          </tr>
          ${currentData.penilaian.map(p => `
            <tr>
              <td style="border: 1px solid #cbd5e1; font-weight: bold;">${p.aspek}</td>
              <td style="border: 1px solid #cbd5e1;">${p.teknik}</td>
              <td style="border: 1px solid #cbd5e1;">${p.instrumen}</td>
            </tr>
          `).join('')}
        </table>
      `;

      document.getElementById("documentContent").innerHTML = html;
    }

    function downloadWord() {
      const content = document.getElementById("documentContent").innerHTML;
      const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' "+
            "xmlns:w='urn:schemas-microsoft-com:office:word' "+
            "xmlns='http://www.w3.org/TR/REC-html40'>"+
            "<head><meta charset='utf-8'><title>RPH MBQ IWR</title></head><body>";
      const footer = "</body></html>";
      const sourceHTML = header + content + footer;

      const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
      const fileDownload = document.createElement("a");
      document.body.appendChild(fileDownload);
      fileDownload.href = source;
      fileDownload.download = `RPH_MBQ_IWR_${currentData.judulModul.substring(0,20)}.doc`;
      fileDownload.click();
      document.body.removeChild(fileDownload);
    }

    // Inisialisasi awal saat halaman dibuka
    window.onload = function() {
      applyPreset();
    };
  </script>
